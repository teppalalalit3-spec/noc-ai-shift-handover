services:
  noc-dashboard:
    build: 
      context: .
      target: runner # Explicitly tells compose to run the final stage
    image: noc-shift-handover:latest
    container_name: noc-dashboard
    restart: unless-stopped
    
    ports:
      - "8000:8000"
    
    env_file:
      - .env
    
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
    # Securely managed named volumes to avoid non-root permission issues
    volumes:
      - reports_data:/app/reports
      - app_data:/app/data

    # Match the updated endpoint in your Dockerfile healthcheck
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  reports_data:
  app_data:
