
services:

  noc-dashboard:

    image: noc-shift-handover:latest

    build: .

    container_name: noc-dashboard

    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./reports:/app/reports
      - ./data:/app/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
